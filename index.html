<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>杂文随笔</title>
  <meta name="description" content="一篇写给自己与生活的随笔。" />

  <!-- 分享卡片（微信 / 各平台抓取），请按需修改图片地址 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="杂文随笔" />
  <meta property="og:description" content="一篇写给自己与生活的随笔。" />
  <meta property="og:image" content="share-cover.png" />
  <meta name="theme-color" content="#0d0e13" />

  <!-- 字体（霞鹜文楷 · 已按本篇随笔子集化，仅 2 个小文件） -->
  <link rel="stylesheet" href="assets/fonts/essay-fonts.css?v=ms9vmff1" />

  <link rel="stylesheet" href="css/style.css?v=ms9vmff1" />
</head>
<body>

  <canvas id="particles"></canvas>

  <!-- 顶部阅读进度 -->
  <div id="progressBar"></div>

  <!-- 音乐开关 -->
  <button id="musicBtn" type="button" aria-label="播放 / 暂停音乐">
    <span class="music-icon" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="musicBadge">again</span>
  </button>

  <!-- 封面：缓冲 + 开启 -->
  <div id="cover" role="button" tabindex="-1" aria-label="开启这篇随笔">
    <canvas id="coverCanvas" aria-hidden="true"></canvas>
    <div class="cover-inner">
      <p class="cover-eyebrow" id="coverEyebrow">一篇随笔</p>
      <h1 class="cover-title" id="coverTitle">杂文随笔</h1>
      <p class="cover-subtitle" id="coverSubtitle">Do or die</p>
      <button id="coverBtn" type="button">轻触 开启</button>
      <p class="cover-tip" id="coverTip"></p>
    </div>
  </div>
  </div>

  <!-- 正文舞台 -->
  <main id="stage">
    <article id="essay"></article>
  </main>

  <!-- 底部歌词 -->
  <div id="lyricBar">
    <p id="lyricLine"></p>
  </div>

  <script src="js/essays.js?v=ms9vmff1"></script>
  <script src="js/app.js?v=ms9vmff1"></script>
</body>
</html>
